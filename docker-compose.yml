version: '3.8'

services:
  omnipilot-x:
    build:
      context: .
      dockerfile: Dockerfile
    image: omnipilot-x:latest
    container_name: omnipilot-x
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./omnipilot_data:/.omnipilot_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
